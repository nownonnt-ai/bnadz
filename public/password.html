<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المصادقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f2f3f4;
    --ink-dim: rgba(242, 243, 244, .78);
    --line: rgba(242, 243, 244, .9);
    --bg-0: #0c0f12;
    --green: #4caf50;
    --green-ink: #ffffff;
    --key: rgba(255, 255, 255, .55);
    --alert: #ffd0c8;
    box-sizing: border-box;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  :root[data-theme="dark"] { color-scheme: dark; }

  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg-0);
    color: var(--ink);
    font-family: "Cairo", "Segoe UI", "Noto Sans Arabic", system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== شريط العنوان الأخضر ===== */
  .appbar {
    direction: ltr;
    flex: none;
    position: relative;
    z-index: 3;
    background: var(--green);
    color: var(--green-ink);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    box-shadow: 0 1px 0 rgba(0, 0, 0, .12);
  }
  .back {
    flex: none;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  .back svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .back:hover { background: rgba(255, 255, 255, .16); }
  .back:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .appbar h1 {
    margin: 0;
    font-size: clamp(16px, 4.4vw, 19px);
    font-weight: 700;
    letter-spacing: .2px;
  }

  /* ===== الخلفية: صورة المكتب ===== */
  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px clamp(18px, 6vw, 48px);
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }

  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(8, 10, 12, .30) 0%, rgba(8, 10, 12, .10) 30%, rgba(8, 10, 12, .55) 100%),
      radial-gradient(70% 45% at 50% 38%, rgba(8, 10, 12, .35) 0%, rgba(8, 10, 12, 0) 100%);
  }

  .panel {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  /* ===== قفل مفتوح ===== */
  .lock {
    width: clamp(64px, 19vw, 84px);
    height: auto;
    margin: 0 auto clamp(26px, 8vw, 40px);
    display: block;
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .prompt {
    margin: 0 0 clamp(14px, 4vw, 20px);
    font-size: clamp(13px, 3.5vw, 16px);
    font-weight: 400;
    color: var(--ink);
  }

  .field {
    width: 100%;
    display: block;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    color: var(--ink);
    font: inherit;
    font-size: clamp(22px, 6.4vw, 30px);
    line-height: 1.25;
    letter-spacing: .22em;
    text-indent: .22em;
    text-align: center;
    padding: 0 2px 6px;
    outline: none;
    transition: border-color .18s ease;
  }
  .field:focus-visible { border-bottom-color: #fff; }
  .field.invalid { border-bottom-color: var(--alert); }

  .error {
    margin: 10px 0 0;
    min-height: 1.2em;
    font-size: 12px;
    color: var(--alert);
    opacity: 0;
    transition: opacity .18s ease;
  }
  .error.show { opacity: 1; }

  .row {
    direction: ltr;
    display: flex;
    justify-content: flex-end;
    margin-top: clamp(20px, 6vw, 30px);
  }

  .go {
    flex: none;
    width: clamp(78px, 20vw, 104px);
    height: clamp(40px, 10vw, 48px);
    border: 0;
    border-radius: 999px;
    background: var(--green);
    color: #ffffff;
    display: grid;
    place-items: center;
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background-color .2s ease, opacity .2s ease, transform .12s ease;
  }
  .go svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .go:hover { background: #45a049; }
  .go:active { transform: scale(.97); }
  .go:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .go[data-idle="true"] { opacity: .55; }
  .go[data-busy="true"] { pointer-events: none; }
  .go[data-busy="true"] .arrow { display: none; }
  .spinner { display: none; }
  .go[data-busy="true"] .spinner { display: block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== الكيبورد المخصص ===== */
  .kb {
    flex: none;
    position: relative;
    z-index: 4;
    direction: ltr;
    background: #e9eaf2;
    color: #1b1c1f;
    padding: clamp(10px, 2.6vw, 16px) clamp(6px, 2vw, 14px);
    padding-bottom: calc(clamp(10px, 2.6vw, 16px) + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -8px 24px rgba(0, 0, 0, .35);
    user-select: none;
    -webkit-user-select: none;
  }
  .kb[hidden] { display: none; }

  .kb-row {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: clamp(2px, .8vw, 6px);
  }
  .kb-row + .kb-row { margin-top: clamp(6px, 2.2vw, 14px); }
  .kb-row.last { grid-template-columns: repeat(8, 1fr); }

  .key {
    appearance: none;
    border: 0;
    background: transparent;
    color: inherit;
    font-family: "Cairo", system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(17px, 4.6vw, 24px);
    line-height: 1;
    height: clamp(38px, 9.5vw, 52px);
    border-radius: 10px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background-color .12s ease;
  }
  .key.small { font-size: clamp(14px, 3.8vw, 20px); color: #3a3c42; }
  .key:hover { background: rgba(0, 0, 0, .06); }
  .key:active { background: rgba(0, 0, 0, .14); }
  .key:focus-visible { outline: 2px solid #4caf50; outline-offset: -2px; }

  .key svg { width: clamp(20px, 5.4vw, 28px); height: clamp(20px, 5.4vw, 28px); }
  .key.shift svg { fill: #1b1c1f; }
  .key.shift[aria-pressed="true"] { background: rgba(76, 175, 80, .2); }
  .key.del svg .plate { fill: #34a853; }
  .key.del svg .mark { stroke: #fff; stroke-width: 2.4; stroke-linecap: round; }

  /* ===== شاشة التحميل ===== */
  .loading {
    position: relative;
    z-index: 2;
    text-align: center;
  }
  .ring {
    width: clamp(46px, 12vw, 60px);
    height: clamp(46px, 12vw, 60px);
    margin: 0 auto clamp(16px, 4vw, 22px);
    display: block;
    fill: none;
    stroke-width: 3.4;
    stroke-linecap: round;
    animation: spin 1.05s linear infinite;
  }
  .ring .track { stroke: rgba(255, 255, 255, .22); }
  .ring .head { stroke: var(--green); stroke-dasharray: 44 120; }
  .loading p {
    margin: 0;
    font-size: clamp(13px, 3.6vw, 16px);
    font-weight: 700;
    color: var(--ink);
  }
  .again {
    margin-top: 26px;
    background: transparent;
    border: 1px solid rgba(242, 243, 244, .5);
    border-radius: 999px;
    color: var(--ink-dim);
    font: inherit;
    font-size: 12px;
    padding: 7px 16px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .4s ease;
  }
  .again.show { opacity: 1; }
  .again:hover { background: rgba(242, 243, 244, .1); }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <header class="appbar">
    <button class="back" type="button" id="back" aria-label="رجوع">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5"/><path d="M11 5l-6 7 6 7"/></svg>
    </button>
    <h1>المصادقة</h1>
  </header>

  <main class="stage">
    <div class="bg" aria-hidden="true"></div>

    <form class="panel" id="form" novalidate>
      <svg class="lock" viewBox="0 0 64 78" aria-hidden="true">
        <path d="M20 34V20a12 12 0 0 1 24 0"/>
        <rect x="4" y="34" width="44" height="40" rx="7"/>
        <circle cx="26" cy="54" r="4.5"/>
      </svg>

      <label class="prompt" for="password">أدخل كلمة السر الخاصة بك</label>
      <input id="password" name="password" class="field" type="password"
             autocomplete="off" autocapitalize="none" spellcheck="false"
             inputmode="none" readonly aria-describedby="error">
      <p class="error" id="error" role="alert"></p>

      <div class="row">
        <button class="go" type="submit" id="go" data-idle="true" aria-label="تأكيد">
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12h15"/><path d="M13 6l6 6-6 6"/>
          </svg>
          <svg class="spinner" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a9 9 0 1 1-6.4 2.6"/>
          </svg>
        </button>
      </div>
    </form>

    <section class="loading" id="loading" hidden aria-live="polite">
      <svg class="ring" viewBox="0 0 48 48" aria-hidden="true">
        <circle class="track" cx="24" cy="24" r="20"/>
        <circle class="head" cx="24" cy="24" r="20"/>
      </svg>
      <p>جاري التحميل…</p>
      <button class="again" type="button" id="again">رجوع</button>
    </section>

  </main>

  <div class="kb" id="kb" hidden role="group" aria-label="لوحة مفاتيح آمنة">
    <div class="kb-row" id="rowDigits"></div>
    <div class="kb-row" id="rowSymbols"></div>
    <div class="kb-row" id="rowA"></div>
    <div class="kb-row" id="rowB"></div>
    <div class="kb-row last" id="rowC"></div>
  </div>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('password');
  const go = document.getElementById('go');
  const error = document.getElementById('error');
  const loading = document.getElementById('loading');
  const again = document.getElementById('again');

  const refresh = () => { go.dataset.idle = input.value.trim() ? 'false' : 'true'; };
  refresh();

  input.addEventListener('input', () => {
    refresh();
    input.classList.remove('invalid');
    error.classList.remove('show');
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const pass = input.value.trim();

    if (!pass) {
      input.classList.add('invalid');
      error.textContent = 'اكتب كلمة السر عشان تكمل';
      error.classList.add('show');
      input.focus();
      return;
    }

    closeKeyboard();
    go.dataset.busy = 'true';
    // هنا مكان التحقق الحقيقي من كلمة السر على السيرفر
    setTimeout(() => {
      go.dataset.busy = 'false';
      form.hidden = true;
      loading.hidden = false;
      // في التطبيق الحقيقي: location.href = 'loading.html';
      setTimeout(() => again.classList.add('show'), 2200);
    }, 500);
  });

  again.addEventListener('click', () => {
    loading.hidden = true;
    again.classList.remove('show');
    form.hidden = false;
    input.value = '';
    refresh();
    input.focus();
  });

  /* ===== لوحة المفاتيح الآمنة: ترتيب الحروف بيتغير كل مرة ===== */
  const kb = document.getElementById('kb');
  const SYMBOLS = ['!', '.', '?', '*', '_', '$', '+', '@', '%', '#'];
  let caps = false;

  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const typeChar = (ch) => {
    input.value += caps ? ch.toUpperCase() : ch;
    input.dispatchEvent(new Event('input'));
  };

  const makeKey = (label, cls) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key' + (cls ? ' ' + cls : '');
    b.textContent = label;
    b.addEventListener('click', () => typeChar(label));
    return b;
  };

  const fill = (el, items, cls) => {
    el.replaceChildren();
    items.forEach((c) => el.appendChild(makeKey(c, cls)));
  };

  const shiftKey = () => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key shift';
    b.setAttribute('aria-label', 'حروف كبيرة');
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 12h4v7h8v-7h4z"/></svg>';
    b.addEventListener('click', () => {
      caps = !caps;
      b.setAttribute('aria-pressed', String(caps));
      document.querySelectorAll('.kb .key:not(.shift):not(.del):not(.small)').forEach((k) => {
        k.textContent = caps ? k.textContent.toUpperCase() : k.textContent.toLowerCase();
      });
    });
    return b;
  };

  const delKey = () => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key del';
    b.setAttribute('aria-label', 'مسح');
    b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path class="plate" d="M9 5h11a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6.4-6.4a1.6 1.6 0 0 1 0-2.2z"/>' +
      '<path class="mark" d="M12.5 9.5l6 5M18.5 9.5l-6 5" fill="none"/></svg>';
    b.addEventListener('click', () => {
      input.value = input.value.slice(0, -1);
      input.dispatchEvent(new Event('input'));
    });
    return b;
  };

  const buildKeyboard = () => {
    caps = false;
    const digits = shuffle('0123456789'.split(''));
    const letters = shuffle('abcdefghijklmnopqrstuvwxyz'.split(''));

    fill(document.getElementById('rowDigits'), digits, 'small');
    fill(document.getElementById('rowSymbols'), shuffle(SYMBOLS), 'small');
    fill(document.getElementById('rowA'), letters.slice(0, 10));
    fill(document.getElementById('rowB'), letters.slice(10, 20));

    const last = document.getElementById('rowC');
    last.replaceChildren();
    last.appendChild(shiftKey());
    letters.slice(20).forEach((c) => last.appendChild(makeKey(c)));
    last.appendChild(delKey());
  };

  const openKeyboard = () => {
    if (kb.hidden) buildKeyboard();   // ترتيب جديد كل مرة تفتح
    kb.hidden = false;
  };
  const closeKeyboard = () => { kb.hidden = true; };

  input.addEventListener('focus', openKeyboard);
  input.addEventListener('click', openKeyboard);
  document.querySelector('.stage').addEventListener('mousedown', (e) => {
    if (!e.target.closest('.field') && !e.target.closest('.go')) closeKeyboard();
  });

  document.getElementById('back').addEventListener('click', () => {
    if (history.length > 1) history.back();
  });
</script>
</body>
</html>
